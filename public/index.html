<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mystin Office</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Mystin Office</h1>
    <p class="tagline">Type a task, pick who does it, the result gets filed into your notes.</p>
  </header>

  <main>
    <section class="task-panel">
      <label for="agent-select">Who's on it</label>
      <select id="agent-select"></select>

      <label for="task-input">What needs doing</label>
      <textarea id="task-input" rows="4" placeholder="e.g. Write a short LinkedIn post announcing our new pricing page."></textarea>

      <button id="submit-btn">Send it</button>
      <span id="status"></span>
    </section>

    <section class="result-panel" id="result-panel" hidden>
      <h2 id="result-agent"></h2>
      <div id="transcript"></div>

      <div class="reply" id="reply-box" hidden>
        <label for="reply-input">Say something back</label>
        <textarea id="reply-input" rows="3" placeholder="e.g. Make it shorter and drop the last line."></textarea>
        <button type="button" id="reply-btn">Reply</button>
        <span class="reply-status" id="reply-status"></span>
      </div>

      <p class="note-path">Saved to <code id="result-file"></code></p>
      <p class="used-notes" id="result-notes" hidden></p>

      <div class="verdict" id="verdict-bar">
        <span class="verdict-label">What did you do with it?</span>
        <button type="button" class="verdict-btn" data-verdict="kept">Used it as-is</button>
        <button type="button" class="verdict-btn" data-verdict="edited">Fixed it up</button>
        <button type="button" class="verdict-btn" data-verdict="discarded">Threw it away</button>
        <span class="verdict-status" id="verdict-status"></span>
      </div>

      <div class="correction" id="correction-box" hidden>
        <label for="correction-input">Paste what you actually used — future briefs will quote this instead of the draft above</label>
        <textarea id="correction-input" rows="6"></textarea>
        <button type="button" id="correction-save">Save correction</button>
      </div>
    </section>

    <section class="notes-panel">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
