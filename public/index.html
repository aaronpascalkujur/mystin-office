<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mystin Office</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Mystin Office</h1>
    <p class="tagline">Type a task, pick who does it, the result gets filed into your notes.</p>
  </header>

  <main>
    <section class="task-panel">
      <label for="agent-select">Who's on it</label>
      <select id="agent-select"></select>

      <label for="task-input">What needs doing</label>
      <textarea id="task-input" rows="4" placeholder="e.g. Write a short LinkedIn post announcing our new pricing page."></textarea>

      <button id="submit-btn">Send it</button>
      <span id="status"></span>
    </section>

    <section class="result-panel" id="result-panel" hidden>
      <h2 id="result-agent"></h2>
      <pre id="result-text"></pre>
      <p class="note-path">Saved to <code id="result-file"></code></p>
    </section>

    <section class="notes-panel">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
